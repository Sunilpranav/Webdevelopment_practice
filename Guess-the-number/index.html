<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Guess The Number 1 to 10</h1>
        <h2>Enter The Number:<input id="element"></h2>
        <button onclick="score()">Click</button>
        <h3><span id="phara">Wrong Answer </span>Score:<span id="result">10</span></h3>
        <script>
            var c=Math.floor((Math.random()*10)+1)
            var scores=10;
            function score()
            {
                console.log(c)
                if(document.getElementById("element").value==c)
                {
                    document.getElementById("phara").textContent="Congratulation "
                    // console.log("Congratulation")
                }
                else{
                    document.getElementById("phara").textContent="Wrong Answer "
                    //var a=document.getElementById("element").value;
                    scores=scores-1;
                    document.getElementById("result").textContent=scores
                    console.log(scores)
                    // console.log("Wrong Answer")
                }
            }
        </script>
    </body>
</html>
